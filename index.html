    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VU Routine & Finder</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="View your class routine">
    <meta name="author" content="Lovable" />
    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />

    <script>
      (function() {
        try {
          var theme = localStorage.getItem('routine-theme') || 'system';
          var activeTheme = theme;
          if (theme === 'system') {
            activeTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var isDark = activeTheme === 'dark';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(activeTheme);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
          
          var color = isDark ? '#020817' : '#ffffff';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          var found = false;
          metas.forEach(function(meta, idx) {
            if (idx === 0) {
              meta.removeAttribute('media');
              meta.setAttribute('content', color);
              found = true;
            } else {
              meta.remove();
            }
          });
          if (!found) {
            var meta = document.createElement('meta');
            meta.setAttribute('name', 'theme-color');
            meta.setAttribute('id', 'theme-color-meta');
            meta.setAttribute('content', color);
            document.head.appendChild(meta);
          }
          
          var appleMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (appleMeta) {
            appleMeta.setAttribute('content', isDark ? 'black-translucent' : 'default');
          }
        } catch (e) {}
      })();
    </script>

  <meta name="twitter:title" content="VU Routine & Finder">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search_insights" />
  
  <script>
    function syncThemeState() {
      const isDark =
        document.documentElement.classList.contains("dark") ||
        document.body.classList.contains("dark");

      const theme = isDark ? "dark" : "light";
      const color = isDark ? "#020817" : "#ffffff";

      // Keep CSS color-scheme synchronized for Android/Chrome UI
      document.documentElement.style.colorScheme = theme;

      // Keep single theme-color meta tag synchronized without media queries
      const metas = document.querySelectorAll('meta[name="theme-color"]');
      let found = false;
      metas.forEach((meta, idx) => {
        if (idx === 0) {
          meta.removeAttribute("media");
          meta.setAttribute("content", color);
          found = true;
        } else {
          meta.remove();
        }
      });
      if (!found) {
        const meta = document.createElement("meta");
        meta.setAttribute("name", "theme-color");
        meta.setAttribute("id", "theme-color-meta");
        meta.setAttribute("content", color);
        document.head.appendChild(meta);
      }

      // iOS status bar style
      const appleMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
      if (appleMeta) {
        appleMeta.setAttribute("content", isDark ? "black-translucent" : "default");
      }

      // Safe check for Flutter WebView channel
      if (window.ThemeChannel && window.ThemeChannel.postMessage) {
        window.ThemeChannel.postMessage(theme);
      }
    }

    // 🔥 Debounce to prevent spam calls
    let themeTimeout = null;

    function safeSendTheme() {
      clearTimeout(themeTimeout);
      themeTimeout = setTimeout(syncThemeState, 50);
    }

    // 1. Send theme on page load
    window.addEventListener("load", safeSendTheme);

    // 2. Observe HTML + BODY for class changes
    const observer = new MutationObserver(() => {
      safeSendTheme();
    });

    // Start observing when DOM is ready
    document.addEventListener("DOMContentLoaded", () => {
      observer.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["class"],
      });

      observer.observe(document.body, {
        attributes: true,
        attributeFilter: ["class"],
      });

      // initial check
      safeSendTheme();
    });
  </script>
</head>
