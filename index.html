<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VU Routine & Finder</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="View your class routine">
    <meta name="author" content="Lovable" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020817" media="(prefers-color-scheme: dark)" />

    <script>
      (function() {
        try {
          var theme = localStorage.getItem('routine-theme') || 'system';
          var activeTheme = theme;
          if (theme === 'system') {
            activeTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.add(activeTheme);
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas.forEach(function(meta) {
            meta.setAttribute('content', activeTheme === 'dark' ? '#020817' : '#ffffff');
          });
        } catch (e) {}
      })();
    </script>

  <script>
    function sendThemeToApp() {
      var isDark = document.documentElement.classList.contains('dark') || document.body.classList.contains('dark');
      var theme = isDark ? 'dark' : 'light';
      if (window.ThemeChannel && window.ThemeChannel.postMessage) {
        window.ThemeChannel.postMessage(theme);
      }
    }

    window.addEventListener('load', sendThemeToApp);

    var themeObserver = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.attributeName === 'class') {
          sendThemeToApp();
        }
      });
    });

    themeObserver.observe(document.documentElement, { attributes: true });
    
    // Check when body exists
    document.addEventListener("DOMContentLoaded", function() {
      themeObserver.observe(document.body, { attributes: true });
    });
  </script>
</head>
