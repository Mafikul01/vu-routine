<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VU Routine & Finder</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="View your class routine">
    <meta name="author" content="Lovable" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020817" media="(prefers-color-scheme: dark)" />

    <script>
      (function() {
        try {
          var theme = localStorage.getItem('routine-theme') || 'system';
          var activeTheme = theme;
          if (theme === 'system') {
            activeTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.add(activeTheme);
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas.forEach(function(meta) {
            meta.setAttribute('content', activeTheme === 'dark' ? '#020817' : '#ffffff');
          });
        } catch (e) {}
      })();
    </script>
    
    <link rel="icon" type="image/png" href="https://i.imgur.com/X13BpyI.png" />

  <script>
    window.__pendingFlutterToken = null;
    window.__pendingFlutterLoginEvent = false;
    window.addEventListener('flutterLogin', function(event) {
      window.__pendingFlutterLoginEvent = true;
      if (event && event.detail && event.detail.idToken) {
        window.__pendingFlutterToken = event.detail.idToken;
      }
    });

    function sendThemeToApp() {
      const isDark =
        document.documentElement.classList.contains("dark") ||
        document.body.classList.contains("dark");

      const theme = isDark ? "dark" : "light";

      // Safe check for Flutter WebView channel
      if (window.ThemeChannel && window.ThemeChannel.postMessage) {
        window.ThemeChannel.postMessage(theme);
      }
    }

    // 🔥 Debounce to prevent spam calls
    let themeTimeout = null;

    function safeSendTheme() {
      clearTimeout(themeTimeout);
      themeTimeout = setTimeout(sendThemeToApp, 100);
    }

    // 1. Send theme on page load
    window.addEventListener("load", safeSendTheme);

    // 2. Observe HTML + BODY for class changes
    const observer = new MutationObserver(() => {
      safeSendTheme();
    });

    // Start observing when DOM is ready
    document.addEventListener("DOMContentLoaded", () => {
      observer.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["class"],
      });

      observer.observe(document.body, {
        attributes: true,
        attributeFilter: ["class"],
      });

      // initial check
      safeSendTheme();
    });
  </script>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
